# fly.toml app configuration file generated for tldw-old-surf-184 on 2026-02-27T16:36:40-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tldw-old-surf-184'
primary_region = 'nrt'

[build]

[env]
  DATABASE_PATH = '/app/output/tldw.db'

[[mounts]]
  source = 'tldw_data'
  destination = '/app/output'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
